services:
  db:
    image: postgres:16-alpine
    container_name: medclinic-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-medclinic}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - medclinic-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  medclinic-data:
